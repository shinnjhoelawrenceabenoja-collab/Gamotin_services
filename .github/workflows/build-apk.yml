name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Your server address, e.g. https://gamotin.onrender.com'
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Create Android project around our code
        working-directory: app
        run: |
          flutter create --org com.gamotin --project-name gamotin_services --platforms=android .
          bash tools/patch_android.sh
          flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --dart-define=API_URL=${{ github.event.inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: gamotin-services-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
